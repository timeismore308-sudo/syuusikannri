
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラスの収入管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#f5f6f8;
  color:#222;
}

.container{
  width:min(1100px,calc(100% - 32px));
  margin:auto;
  padding:28px 0 48px;
}

h1{
  margin:0 0 24px;
  font-size:clamp(26px,4vw,38px);
}

h2{
  margin:0 0 16px;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.full{
  grid-column:1/-1;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

.unit{
  display:flex;
  align-items:center;
  gap:8px;
}

.unit input{
  flex:1;
}

input{
  width:100%;
  min-height:52px;
  padding:10px 14px;
  border:1px solid #cfd3d8;
  border-radius:10px;
  font-size:20px;
  background:#fff;
}

input:focus{
  outline:none;
  border-color:#222;
  box-shadow:0 0 0 3px rgba(0,0,0,.08);
}

.unit span{
  font-size:18px;
  font-weight:600;
  white-space:nowrap;
}

.results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.result{
  padding:18px;
  border-radius:12px;
  background:#f0f2f5;
}

.name{
  font-size:15px;
  color:#555;
  font-weight:700;
}

.value{
  margin-top:6px;
  font-size:clamp(24px,4vw,34px);
  font-weight:800;
}

.sub-result{
  margin-top:12px;
  padding:14px;
  background:#fafafa;
  border:1px solid #e5e5e5;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.sub-result .label{
  margin:0;
  color:#555;
  font-weight:700;
}

.sub-result .amount{
  font-weight:800;
  font-size:18px;
}

button{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:active{
  transform:scale(.98);
}

.add{
  background:#222;
  color:#fff;
}

.add:hover{
  background:#000;
}

.reset{
  margin-top:10px;
  background:#e8eaed;
  color:#222;
}

.reset:hover{
  background:#dcdfe3;
}

.history{
  width:100%;
  border-collapse:collapse;
}

.history th,
.history td{
  padding:10px;
  border-bottom:1px solid #e2e4e7;
  text-align:right;
}

.history th:first-child,
.history td:first-child{
  text-align:center;
}

.empty{
  color:#777;
  text-align:center!important;
  padding:20px!important;
}

.note{
  color:#666;
  font-size:14px;
  margin-top:8px;
  line-height:1.6;
}

.ticket-info{
  margin-top:12px;
  padding:12px 14px;
  background:#f5f6f8;
  border-radius:10px;
  font-size:14px;
  color:#555;
}

.ticket-info strong{
  color:#222;
}

@media(max-width:700px){

  .container{
    width:min(100% - 20px,600px);
    padding-top:18px;
    padding-bottom:32px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .results{
    grid-template-columns:1fr;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  h1{
    margin-bottom:18px;
  }

  .value{
    font-size:30px;
  }

  .history{
    font-size:14px;
  }

  .history th,
  .history td{
    padding:9px 6px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>クラスの収入管理</h1>

  <div class="grid">

    <!-- ================================
         前提条件
    ================================= -->

    <section class="card">

      <h2>前提条件</h2>

      <div class="field">
        <label for="funds">資金</label>

        <div class="unit">
          <input
            id="funds"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          >
          <span>円</span>
        </div>
      </div>

      <div class="field">
        <label for="cost">消費</label>

        <div class="unit">
          <input
            id="cost"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          >
          <span>円</span>
        </div>
      </div>

      <div class="field">
        <label for="price">入場料金</label>

        <div class="unit">
          <input
            id="price"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          >
          <span>円 / 人</span>
        </div>
      </div>

      <div class="ticket-info">
        前売り券の料金：
        <strong>100円 / 枚</strong>
      </div>

      <div class="note">
        資金・消費・入場料金を設定すると、
        入場者数と前売り券から利益・総収入を自動計算します。
      </div>

    </section>


    <!-- ================================
         現在の収益
    ================================= -->

    <section class="card">

      <h2>現在の収益</h2>

      <div class="results">

        <div class="result">
          <div class="name">入場者数</div>
          <div class="value" id="totalVisitors">
            0 人
          </div>
        </div>

        <div class="result">
          <div class="name">利益</div>
          <div class="value" id="earnings">
            0 円
          </div>
        </div>

        <div class="result">
          <div class="name">総収入</div>
          <div class="value" id="profit">
            0 円
          </div>
        </div>

      </div>

      <div class="sub-result">
        <div class="label">前売り券売上</div>

        <div class="amount" id="advanceRevenue">
          0 円
        </div>
      </div>

    </section>


    <!-- ================================
         入場者数・前売り券
    ================================= -->

    <section class="card full">

      <h2>入力対応</h2>

      <div class="field">

        <label for="visitors">
          今回の入場者数
        </label>

        <div class="unit">

          <input
            id="visitors"
            type="number"
            min="1"
            step="1"
            placeholder="例：5"
          >

          <span>人</span>

        </div>

      </div>

      <button class="add" id="addBtn">
        入場者数を追加
      </button>


      <div class="field" style="margin-top:20px;">

        <label for="advanceTickets">
          前売り券
        </label>

        <div class="unit">

          <input
            id="advanceTickets"
            type="number"
            min="0"
            step="1"
            placeholder="例：10"
          >

          <span>枚</span>

        </div>

      </div>

      <div class="note">
        前売り券1枚につき100円として計算します。
      </div>

      <button class="reset" id="resetBtn">
        すべてリセット
      </button>

    </section>


    <!-- ================================
         履歴
    ================================= -->

    <section class="card full">

      <h2>入場者数の履歴</h2>

      <table class="history">

        <thead>
          <tr>
            <th>回</th>
            <th>今回</th>
            <th>累計</th>
          </tr>
        </thead>

        <tbody id="historyBody">

          <tr>
            <td colspan="3" class="empty">
              まだ入力されていません
            </td>
          </tr>

        </tbody>

      </table>


      <!-- クラス費 -->

      <div class="sub-result">

        <div class="label">
          クラス費
        </div>

        <div class="amount" id="classFee">
          0 円
        </div>

      </div>

    </section>

  </div>

</div>


<script>

/* ========================================
   基本設定
======================================== */

/*
 * 前売り券1枚あたりの料金
 */
const ADVANCE_TICKET_PRICE = 100;


/* ========================================
   HTML要素取得
======================================== */

const $ = id => document.getElementById(id);


/* ========================================
   保存データ
======================================== */

const defaultState = {
  funds: 0,
  cost: 0,
  price: 0,
  advanceTickets: 0,
  entries: []
};


/*
 * state の役割
 *
 * funds:
 *   現在使える資金
 *
 * cost:
 *   資金から消費した金額
 *
 * price:
 *   通常入場1人あたりの料金
 *
 * advanceTickets:
 *   販売した前売り券の枚数
 *
 * entries:
 *   その都度追加された入場者数
 */

const state = JSON.parse(
  localStorage.getItem('visitorRevenueState') ||
  JSON.stringify(defaultState)
);


/* ========================================
   金額表示
======================================== */

const money = n =>
  Math.round(n).toLocaleString('ja-JP') + ' 円';


/* ========================================
   データ保存
======================================== */

function save(){

  localStorage.setItem(
    'visitorRevenueState',
    JSON.stringify(state)
  );

}


/* ========================================
   前売り券売上計算
======================================== */

/*
 * 前売り券売上
 *
 * 前売り券枚数 × 前売り券料金
 */

function getAdvanceTicketRevenue(){

  return (
    state.advanceTickets *
    ADVANCE_TICKET_PRICE
  );

}


/* ========================================
   画面更新・全計算
======================================== */

function render(){

  /* ----------------------------------------
     前提条件を画面へ反映
  ---------------------------------------- */

  ['funds','cost','price'].forEach(id => {

    $(id).value = state[id] || '';

  });


  /* ----------------------------------------
     前売り券枚数を画面へ反映
  ---------------------------------------- */

  $('advanceTickets').value =
    state.advanceTickets || '';


  /* ----------------------------------------
     入場者数の累計
  ---------------------------------------- */

  const totalVisitors =
    state.entries.reduce(
      (total, current) =>
        total + current,
      0
    );


  /* ----------------------------------------
     通常入場による売上
  ---------------------------------------- */

  const normalRevenue =
    state.price *
    totalVisitors;


  /* ----------------------------------------
     前売り券による売上
  ---------------------------------------- */

  const advanceRevenue =
    getAdvanceTicketRevenue();


  /* ----------------------------------------
     稼ぎ
     
     稼ぎ =
     通常入場売上
     +
     前売り券売上
  ---------------------------------------- */

  const earnings =
    normalRevenue +
    advanceRevenue;


  /* ----------------------------------------
     利潤
     
     利潤 =
     資金
     -
     消費
     +
     稼ぎ
  ---------------------------------------- */

  const profit =
    state.funds -
    state.cost +
    earnings;


  /* ----------------------------------------
     クラス費
     
     利潤が40,000円以上
       → 利潤 - 20,000円
     
     利潤が40,000円未満
       → 利潤 ÷ 2
       → 小数点以下切り捨て
  ---------------------------------------- */

  let classFee;

  if(profit >= 40000){

    classFee =
      profit - 20000;

  }else{

    classFee =
      Math.floor(profit / 2);

  }


  /* ----------------------------------------
     計算結果を画面へ表示
  ---------------------------------------- */

  $('totalVisitors').textContent =
    totalVisitors.toLocaleString('ja-JP') +
    ' 人';


  $('earnings').textContent =
    money(earnings);


  $('profit').textContent =
    money(profit);


  $('advanceRevenue').textContent =
    money(advanceRevenue);


  $('classFee').textContent =
    money(classFee);


  /* ----------------------------------------
     入場者数履歴
  ---------------------------------------- */

  let cumulativeVisitors = 0;


  $('historyBody').innerHTML =
    state.entries.length

    ? state.entries.map((count,index) => {

        cumulativeVisitors += count;

        return `
          <tr>
            <td>${index + 1}</td>
            <td>
              ${count.toLocaleString('ja-JP')} 人
            </td>
            <td>
              ${cumulativeVisitors.toLocaleString('ja-JP')} 人
            </td>
          </tr>
        `;

      }).join('')

    : `
      <tr>
        <td colspan="3" class="empty">
          まだ入力されていません
        </td>
      </tr>
    `;

}


/* ========================================
   前提条件の入力
======================================== */

['funds','cost','price'].forEach(id => {

  $(id).addEventListener(
    'input',
    () => {

      state[id] =
        Math.max(
          0,
          Number($(id).value) || 0
        );


      save();
      render();

    }
  );

});


/* ========================================
   前売り券枚数の入力
======================================== */

$('advanceTickets').addEventListener(
  'input',
  () => {

    state.advanceTickets =
      Math.max(
        0,
        Math.floor(
          Number(
            $('advanceTickets').value
          ) || 0
        )
      );


    save();
    render();

  }
);


/* ========================================
   入場者数追加
======================================== */

$('addBtn').addEventListener(
  'click',
  () => {

    const count =
      Math.floor(
        Number(
          $('visitors').value
        )
      );


    /*
     * 0以下・数字以外は追加しない
     */

    if(
      !Number.isFinite(count) ||
      count <= 0
    ){

      $('visitors').focus();
      return;

    }


    /*
     * 入場者数を履歴へ追加
     */

    state.entries.push(count);


    /*
     * 入力欄を空にする
     */

    $('visitors').value = '';


    /*
     * 保存して再計算
     */

    save();
    render();


    /*
     * 次の入力へフォーカス
     */

    $('visitors').focus();

  }
);


/* ========================================
   Enterキーで入場者数追加
======================================== */

$('visitors').addEventListener(
  'keydown',
  event => {

    if(event.key === 'Enter'){

      $('addBtn').click();

    }

  }
);


/* ========================================
   リセット
======================================== */

$('resetBtn').addEventListener(
  'click',
  () => {

    if(
      !confirm(
        '入力したデータをすべて削除しますか？'
      )
    ){

      return;

    }


    state.funds = 0;
    state.cost = 0;
    state.price = 0;
    state.advanceTickets = 0;
    state.entries = [];


    save();
    render();

  }
);


/* ========================================
   初期表示
======================================== */

render();

</script>

</body>
</html>
